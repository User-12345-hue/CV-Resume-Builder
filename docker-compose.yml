services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cv_resume_builder
      MYSQL_USER: ${DB_USERNAME:-cvbuilder}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - cvbuilder_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - app-network

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/cv_resume_builder?serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-cvbuilder}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  cvbuilder_data:

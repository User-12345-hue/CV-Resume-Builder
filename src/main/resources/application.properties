spring.application.name=cv-resume-builder
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cv_resume_builder?serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cvbuilder}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
